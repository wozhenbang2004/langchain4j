name: Verify return type classification

on:
  push:
    branches:
      - validation/6869-return-types
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6c2b0c813219dbe3fab90f3eb59ef95a3e1bfeeb
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Check changed Java file formatting
        run: mvn -B -Pspotless -pl langchain4j spotless:check
      - name: Compile and run image and existing return type regressions
        run: mvn -B -pl langchain4j -am test -Dtest=ServiceOutputParserImageReturnTypeTest,ServiceOutputParserTest,AiServiceValidationTest,TypeUtilsTest,JsonSchemasTest -Dsurefire.failIfNoSpecifiedTests=false -DembeddingsSkipDownload
